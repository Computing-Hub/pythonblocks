# Check the pages, then publish them to https://computing-hub.github.io/pythonblocks/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it part way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # vendor/ is not in the repository: refill it from the offline pages.
      # The exercise tests need Skulpt from here, so this comes first.
      - name: Fetch the libraries out of the offline pages
        run: python3 tools/build-offline.py extract

      - name: Test the flowchart core
        run: node tools/test-flowcharts.js

      - name: Test the exercises
        run: node tools/test-exercises.js

      - name: Check the offline copies are in sync
        run: python3 tools/build-offline.py check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Publish the pages themselves, not the tooling around them.
      - name: Collect the site
        run: |
          mkdir _site
          cp *.html _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
