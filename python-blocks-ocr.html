<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Blocks for OCR GCSE Computer Science</title>
<!--
  Python Blocks (OCR J277 edition). One self-contained page: no build step, no server.
  Blocks are built with Blockly; the Python they produce is run for real in the browser by Skulpt.
  Sections of the script below: 1 CORE (blocks, generators, toolbox)  2 CONTENT (help topics, examples)
  3 VIRTUAL FILES  4 INTERFACE  5 START UP (library loading).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F7FB; --surface:#FFFFFF; --surface-2:#EAF0F8; --line:#CBD7E6; --grid:#DCE6F2;
  --ink:#14213D; --ink-2:#44546F; --ink-3:#6B7A93;
  --run:#FFD23F; --run-ink:#14213D; --stop:#C92A2A; --focus:#1971C2; --accent:#1971C2;
  --code-bg:#FFFFFF; --code-ink:#14213D; --code-no:#9AA8BD; --code-hit:#FFF1B8;
  --con-bg:#101A30; --con-ink:#DCE7F7; --con-dim:#8FA2C0; --con-err:#FF9B9B; --con-in:#FFD23F;
  --kw:#A61E4D; --fn:#1864AB; --st:#2B7A0B; --nb:#B45309; --cm:#6B7280;
  --ui:"Atkinson Hyperlegible","Verdana","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code","Consolas","Menlo",monospace;
  --side-w:clamp(320px,29vw,430px);
}
:root[data-theme="dark"]{
  --paper:#0F1729; --surface:#17213A; --surface-2:#1E2B49; --line:#2C3B5E; --grid:#1B2742;
  --ink:#E6ECF8; --ink-2:#B5C2DA; --ink-3:#8797B5;
  --run:#FFD23F; --run-ink:#14213D; --focus:#74C0FC; --accent:#74C0FC;
  --code-bg:#131D34; --code-ink:#E6ECF8; --code-no:#5C6E90; --code-hit:#4A3F12;
  --con-bg:#0A1122;
  --kw:#FF8FB1; --fn:#8CC8FF; --st:#A5E08A; --nb:#FFC078; --cm:#8797B5;
}
*{box-sizing:border-box;margin:0;padding:0}
/* Code must look exactly as it is typed: stop the code font joining >= into \2265, != into \2260, == into one long bar */
*,svg text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0,"clig" 0}
html,body{height:100%}
body{font-family:var(--ui);font-size:15px;line-height:1.45;color:var(--ink);background:var(--paper);display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--ink);color:#fff;flex-wrap:wrap}
:root[data-theme="dark"] .bar{background:#0A1122;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:6px}
.brand strong{font-size:19px;letter-spacing:-.01em}
.brand span{font-size:13px;color:#B9C6DC}
.bar .spacer{flex:1}
.nb{border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;padding:6px 13px;border-radius:8px;font-weight:700;font-size:14px}
.nb:hover{background:rgba(255,255,255,.12)}
.nb[aria-expanded="true"]{background:#fff;color:#14213D;border-color:#fff}
.nb.quiet{border-color:transparent;font-weight:400;color:#D5DEEE}
.nb.run{background:var(--run);color:var(--run-ink);border-color:var(--run);padding:6px 20px}
.nb.run:hover{filter:brightness(1.06)}
.nb.stop{background:var(--stop);border-color:var(--stop)}
.nb.armed{background:#FFE3E3;color:#8A1C1C;border-color:#FFE3E3}
.nb[hidden]{display:none}

/* ---------- main layout ---------- */
.app{display:grid;grid-template-columns:auto minmax(0,1fr) 7px var(--side-w);min-height:0}
.drawer{width:clamp(320px,27vw,400px);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.drawer[hidden]{display:none}
.drawer{grid-column:1}.stage{grid-column:2}.handle{grid-column:3}.side{grid-column:4}
.stage{position:relative;min-width:0;min-height:0}
#blocklyDiv{position:absolute;inset:0}
.empty{position:absolute;left:50%;top:42%;transform:translate(-30%,-50%);max-width:340px;color:var(--ink-3);font-size:16px;pointer-events:none;text-align:left}
.empty b{display:block;color:var(--ink-2);font-size:20px;margin-bottom:6px}
.empty[hidden]{display:none}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;color:var(--ink-2)}
.zoom button:hover{background:var(--surface-2)}
.handle{background:var(--line);cursor:col-resize}
.handle:hover,.handle.on{background:var(--accent)}
.side{display:grid;grid-template-rows:minmax(0,1.15fr) minmax(0,1fr);min-width:0;min-height:0;background:var(--surface)}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.pane + .pane{border-top:1px solid var(--line)}
.pane-head{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.pane-head .grow{flex:1}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 10px;font-size:13px;font-weight:400}
.mini:hover{background:var(--paper)}
.tab{border:0;background:transparent;padding:4px 10px;border-radius:7px;font-weight:700;color:var(--ink-3)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

/* ---------- code view ---------- */
.code{flex:1;overflow:auto;background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:14px;line-height:1.6;padding:10px 0}
.ln{display:flex;white-space:pre;padding-right:14px}
.ln .no{flex:none;width:42px;text-align:right;padding-right:12px;color:var(--code-no);user-select:none}
.ln.hit{background:var(--code-hit)}
.code .hint{padding:4px 16px;color:var(--ink-3);font-family:var(--ui);font-size:15px;white-space:normal}
.kw{color:var(--kw);font-weight:700}.fn{color:var(--fn)}.st{color:var(--st)}.nu{color:var(--nb)}.cm{color:var(--cm);font-style:italic}

/* ---------- console + files ---------- */
.console{flex:1;overflow:auto;background:var(--con-bg);color:var(--con-ink);font-family:var(--mono);font-size:14px;line-height:1.55;padding:10px 14px;white-space:pre-wrap;word-break:break-word}
.console .dim{color:var(--con-dim);font-family:var(--ui)}
.console .err{color:var(--con-err);font-family:var(--ui);white-space:normal;margin-top:6px;display:block}
.console .err b{color:#fff}
.console .typed{color:var(--con-in)}
.console input{font:inherit;color:var(--con-in);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:1px 6px;min-width:12ch;width:60%}
.files{flex:1;overflow:auto;padding:10px 12px;background:var(--surface)}
.files p{color:var(--ink-3);font-size:14px;margin-bottom:10px}
.file{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden}
.file header{display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--surface-2);font-family:var(--mono);font-size:13px;font-weight:700}
.file header span{flex:1}
.file pre{font-family:var(--mono);font-size:13px;padding:8px 10px;white-space:pre-wrap;max-height:160px;overflow:auto}
.file pre:empty::before{content:"(empty file)";color:var(--ink-3);font-family:var(--ui)}
[hidden]{display:none !important}

/* ---------- drawer: help + examples ---------- */
.drawer-head{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.drawer-head .grow{flex:1}
.drawer-body{flex:1;overflow:auto;position:relative;padding:12px 12px 40px}
.lede{color:var(--ink-2);margin:2px 4px 12px;max-width:44ch}
.group{font-size:13px;font-weight:700;color:var(--ink-3);margin:16px 4px 6px}
.topic{display:flex;width:100%;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-weight:700}
.topic:hover{background:var(--paper)}
.topic i{flex:none;width:10px;height:22px;border-radius:3px;background:var(--c,#888)}
.topic span{flex:1}
.topic small{font-weight:400;color:var(--ink-3);display:block;font-size:13.5px}
.topic::after{content:"+";color:var(--ink-3);font-weight:400;font-size:18px;line-height:1}
.topic.example::after{content:"";display:none}
.topic[aria-expanded="true"]{border-radius:10px 10px 0 0;background:var(--surface-2);margin-bottom:0}
.topic[aria-expanded="true"]::after{content:"\2212"}
.detail{border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:12px 12px 14px;margin-bottom:8px;background:var(--surface)}
.detail p{margin-bottom:9px;max-width:48ch}
.detail h4{font-size:13px;color:var(--ink-3);margin:12px 0 4px;font-weight:700}
.detail pre{font-family:var(--mono);font-size:13px;line-height:1.55;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:pre}
.detail table{border-collapse:collapse;width:100%;font-size:13.5px;margin:4px 0 8px}
.detail th{text-align:left;color:var(--ink-3);font-size:12.5px;padding:3px 6px;border-bottom:1px solid var(--line)}
.detail td{padding:4px 6px;border-bottom:1px solid var(--grid);vertical-align:top}
.detail td code{font-family:var(--mono);font-size:13px;white-space:nowrap}
.note{background:#FFF6D6;border-left:4px solid var(--run);padding:7px 10px;border-radius:0 8px 8px 0;margin:10px 0 0;font-size:14px;color:#3D3205}
:root[data-theme="dark"] .note{background:#3A3210;color:#F6E7A8}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.act{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:6px 12px;font-weight:700;font-size:14px}
:root[data-theme="dark"] .act{background:var(--run);color:var(--run-ink);border-color:var(--run)}
.act.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:400}
.act.armed{background:#FFE3E3;color:#8A1C1C;border-color:#F3B4B4}

/* ---------- toast + modal ---------- */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-weight:700;z-index:200;max-width:90vw;box-shadow:0 6px 24px rgba(10,20,45,.3)}
:root[data-theme="dark"] .toast{background:#fff;color:#14213D}
.veil{position:fixed;inset:0;background:rgba(10,18,36,.55);display:grid;place-items:center;z-index:80;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;width:min(380px,100%);box-shadow:0 18px 60px rgba(0,0,0,.4)}
.modal p{margin-bottom:10px;font-weight:700}
.modal input{width:100%;font:inherit;font-family:var(--mono);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.modal .actions{justify-content:flex-end}
.fatal{margin:40px auto;max-width:520px;padding:0 20px}

/* ---------- Blockly chrome ---------- */
.blocklyToolbox,.blocklyToolboxDiv{background:var(--surface) !important;border-right:1px solid var(--line);padding:6px 0 !important;color:var(--ink)}
.blocklyToolboxCategory,.blocklyTreeRow{padding:4px 8px 4px 4px !important;margin:1px 4px !important;border-radius:7px;height:auto !important;line-height:1.5 !important}
.blocklyToolboxCategoryLabel,.blocklyTreeLabel{font-family:var(--ui) !important;font-size:14px !important;font-weight:700;color:inherit}
.blocklyToolboxSelected .blocklyToolboxCategoryLabel,.blocklyTreeSelected .blocklyTreeLabel{color:#fff}
.blocklyTreeSeparator,.blocklyToolboxSeparator{border-bottom:1px solid var(--line) !important;margin:6px 10px !important}
.blocklyFlyoutButton .blocklyFlyoutButtonBackground,.blocklyFlyoutButton{fill:var(--ink)}
.blocklyFlyoutLabelText{fill:var(--ink-2) !important;font-family:var(--ui) !important}
.blocklyWidgetDiv .blocklyMenu,.blocklyDropDownDiv{font-family:var(--ui)}

@media (max-width:980px){
  body{overflow:auto;height:auto;min-height:100dvh}
  .app{grid-template-columns:minmax(0,1fr);grid-auto-rows:auto}
  .drawer,.stage,.handle,.side{grid-column:1}
  .drawer{width:100%;max-height:60vh;border-right:0;border-bottom:1px solid var(--line)}
  .stage{height:62vh}
  .handle{display:none}
  .side{grid-template-rows:auto auto}
  .pane{height:300px}
}
@media (prefers-reduced-motion:no-preference){
  .detail{animation:open .16s ease-out}
  @keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><strong>Python Blocks</strong><span>OCR GCSE Computer Science J277</span></div>
  <button class="nb" id="btnHelp" type="button" aria-expanded="false" aria-controls="drawer">Help</button>
  <button class="nb" id="btnExamples" type="button" aria-expanded="false" aria-controls="drawer">Examples</button>
  <span class="spacer"></span>
  <button class="nb quiet" id="btnTheme" type="button">Dark mode</button>
  <button class="nb" id="btnClear" type="button">Clear</button>
  <button class="nb" id="btnCopy" type="button">Copy code</button>
  <button class="nb stop" id="btnStop" type="button" hidden>Stop</button>
  <button class="nb run" id="btnRun" type="button" title="Run (Ctrl + Enter)">Run</button>
</header>

<main class="app">
  <aside class="drawer" id="drawer" aria-label="Help and examples" hidden>
    <div class="drawer-head" role="tablist">
      <button class="tab" id="tabHelp" type="button" role="tab" aria-selected="false">Help</button>
      <button class="tab" id="tabExamples" type="button" role="tab" aria-selected="false">Examples</button>
      <span class="grow"></span>
      <button class="mini" id="btnCloseDrawer" type="button">Close</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <section class="stage" aria-label="Block workspace">
    <div id="blocklyDiv"></div>
    <div class="empty" id="empty"><b>Build your program here</b>Drag blocks out of the menu and snap them under the start block, top to bottom. To delete a block, drag it back onto the menu. Not sure where to start? Open Examples.</div>
    <div class="zoom">
      <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
      <button id="zoomOut" type="button" aria-label="Zoom out">&minus;</button>
      <button id="zoomFit" type="button" aria-label="Fit blocks on screen" title="Fit on screen">&#9635;</button>
    </div>
  </section>

  <div class="handle" id="handle" aria-hidden="true"></div>

  <section class="side">
    <div class="pane">
      <div class="pane-head"><span>Python code</span></div>
      <div class="code" id="code" aria-live="off"></div>
    </div>
    <div class="pane">
      <div class="pane-head" role="tablist">
        <button class="tab" id="tabConsole" type="button" role="tab" aria-selected="true">Console</button>
        <button class="tab" id="tabFiles" type="button" role="tab" aria-selected="false">Files</button>
        <span class="grow"></span>
        <button class="mini" id="btnClearConsole" type="button">Clear</button>
      </div>
      <div class="console" id="console" role="log"></div>
      <div class="files" id="files" hidden></div>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* =====================================================================
   1. CORE — blocks, Python generators, toolbox, program builder
   Works in the browser and in Node (for testing).
   ===================================================================== */
function PB_core(Blockly, pythonNS) {
  var pg = pythonNS.pythonGenerator, Order = pythonNS.Order;

  /* ---- start block: one of these two-word phrases is picked at random each time the page opens.
     Add, remove or reword them freely. ---- */
  var PHRASES = ["Let's code", 'Keep going', 'Think big', 'Stay curious', 'Be bold', 'Dream big', 'Start strong',
    'Go create', 'Build something', 'Think logically', 'Debug calmly', 'Try it', 'Make mistakes', 'Own it', 'Aim high'];
  var PHRASE = PHRASES[Math.floor(Math.random() * PHRASES.length)];

  /* ---- colours: one per concept, all readable with white text ---- */
  var COL = {
    io: '#C2255C', vars: '#1971C2', values: '#5F3DC4', ops: '#A16207', cast: '#475569',
    strings: '#0F766E', arrays: '#2F855A', select: '#C2410C', loops: '#4C51BF',
    subs: '#86198F', files: '#4D7C0F', random: '#0E7490', comment: '#64748B'
  };

  /* ---------------------------------------------------------------
     Block definitions
     --------------------------------------------------------------- */
  var START_COLOUR = '#14213D';
  var STMT = { previousStatement: null, nextStatement: null };
  function val(name) { return { type: 'input_value', name: name }; }
  function body(name) { return { type: 'input_statement', name: name }; }
  function varf(name, def) { return { type: 'field_variable', name: name, variable: def }; }
  function txt(name, def) { return { type: 'field_input', name: name, text: def, spellcheck: false }; }
  function dd(name, opts) { return { type: 'field_dropdown', name: name, options: opts }; }
  function def(type, style, tip, spec) {
    spec.type = type; spec.style = style; spec.tooltip = tip; spec.inputsInline = true;
    return spec;
  }
  function merge(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b) o[k] = b[k]; return o; }

  var ARITH = [['+', '+'], ['-', '-'], ['*', '*'], ['/', '/'], ['//  (DIV)', '//'], ['%  (MOD)', '%'], ['**  (power)', '**']];
  var COMPARE = [['==', '=='], ['!=', '!='], ['<', '<'], ['<=', '<='], ['>', '>'], ['>=', '>='], ['in', 'in'], ['not in', 'not in']];

  var DEFS = [
    /* start of the program (a hat block, like Scratch's green flag) */
    def('py_start', 'start', 'Your program starts here. Only blocks snapped underneath run; loose blocks are ignored.', { message0: '\u25B6  %1', args0: [{ type: 'field_label', name: 'PHRASE', text: 'Start' }], nextStatement: null, extensions: ['pb_start'] }),

    /* input and output */
    def('py_print', 'io', 'Output: show a value on the screen.', merge(STMT, { message0: 'print( %1 )', args0: [val('V')] })),
    def('py_print2', 'io', 'Output two values on one line, separated by a space.', merge(STMT, { message0: 'print( %1 , %2 )', args0: [val('A'), val('B')] })),
    def('py_input', 'io', 'Input: ask the user to type something. Always gives back a string.', { message0: 'input( %1 )', args0: [val('P')], output: null }),

    /* values */
    def('py_text', 'values', 'A string (text). Type \\n for a new line.', { message0: '" %1 "', args0: [txt('T', 'Hello')], output: null }),
    def('py_num', 'values', 'A number. Whole numbers are integers, numbers with a decimal point are reals (floats).', { message0: '%1', args0: [txt('N', '0')], output: null, extensions: ['pb_number'] }),
    def('py_bool', 'values', 'A Boolean value.', { message0: '%1', args0: [dd('B', [['True', 'True'], ['False', 'False']])], output: null }),

    /* variables and constants */
    def('py_set', 'vars', 'Assignment: store a value in a variable.', merge(STMT, { message0: '%1 = %2', args0: [varf('VAR', 'score'), val('V')] })),
    def('py_get', 'vars', 'Use the value stored in a variable.', { message0: '%1', args0: [varf('VAR', 'score')], output: null }),
    def('py_const', 'vars', 'A constant: a value that must not change. Write its name in CAPITALS.', merge(STMT, { message0: 'const %1 = %2', args0: [varf('VAR', 'VAT'), val('V')] })),
    def('py_global', 'vars', 'Inside a sub program: lets you change a variable from the main program.', merge(STMT, { message0: 'global %1', args0: [varf('VAR', 'score')] })),

    /* operators */
    def('py_arith', 'ops', 'Arithmetic: + - * / and DIV (//), MOD (%), power (**).', { message0: '%1 %2 %3', args0: [val('A'), dd('OP', ARITH), val('B')], output: null }),
    def('py_compare', 'ops', 'Comparison: gives True or False.', { message0: '%1 %2 %3', args0: [val('A'), dd('OP', COMPARE), val('B')], output: null }),
    def('py_logic', 'ops', 'Boolean operator: combine two conditions.', { message0: '%1 %2 %3', args0: [val('A'), dd('OP', [['and', 'and'], ['or', 'or']]), val('B')], output: null }),
    def('py_not', 'ops', 'Boolean NOT: reverses True and False.', { message0: 'not %1', args0: [val('A')], output: null }),
    def('py_round', 'ops', 'Round a number to a number of decimal places.', { message0: 'round( %1 , %2 )', args0: [val('X'), val('N')], output: null }),

    /* casting */
    def('py_cast', 'cast', 'Casting: convert a value to another data type.', { message0: '%1 ( %2 )', args0: [dd('FN', [['int', 'int'], ['float', 'float'], ['str', 'str'], ['bool', 'bool']]), val('V')], output: null }),

    /* strings */
    def('py_len', 'strings', 'Length: how many characters in a string, or items in an array.', { message0: 'len( %1 )', args0: [val('S')], output: null }),
    def('py_method', 'strings', 'String method: change case, tidy spaces, or test the contents.', { message0: '%1 . %2', args0: [val('S'), dd('M', [['upper()', 'upper'], ['lower()', 'lower'], ['strip()', 'strip'], ['isdigit()', 'isdigit'], ['isalpha()', 'isalpha']])], output: null }),
    def('py_slice', 'strings', 'Substring: characters from a start position up to, but not including, an end position.', { message0: '%1 [ %2 : %3 ]', args0: [val('S'), val('A'), val('B')], output: null }),
    def('py_left', 'strings', 'The first n characters.', { message0: '%1 [ : %2 ]', args0: [val('S'), val('N')], output: null }),

    if (starts.length) {

    return raw.replace(/\n{3,}/g, '\n\n').replace(/^\n+/, '').replace(/\s+$/, '') + '\n';
  }

  /** Contents of the Variables category, rebuilt each time it opens. */
  function variablesFlyout(ws) {
    var vars = ws.getVariableMap().getAllVariables();
    var out = [{ kind: 'button', text: 'Make a variable', callbackKey: 'PB_NEW_VARIABLE' }];
    var last = vars.length ? { VAR: { id: vars[vars.length - 1].getId() } } : null;
    out.push(B('py_set', null, last), B('py_const'), B('py_global', null, last));
    vars.slice().sort(function (a, b) { return a.getName().localeCompare(b.getName()); })
      .forEach(function (vm) { out.push(B('py_get', null, { VAR: { id: vm.getId() } })); });
    return out;
  }

  var BLOCK_STYLES = {}, k;
  for (k in COL) BLOCK_STYLES[k] = { colourPrimary: COL[k] };
  BLOCK_STYLES.start = { colourPrimary: START_COLOUR, colourSecondary: '#2A3D66', colourTertiary: '#FFD23F', hat: 'cap' };

  /* ---------------------------------------------------------------
     Program builder: a tiny DSL so examples stay readable.
     Statement lists are arrays; they are chained top to bottom.
     --------------------------------------------------------------- */
  function mk(type, fields, inputs) {
    var b = { type: type }, n;
    if (fields) b.fields = fields;
    if (inputs) { b.inputs = {}; for (n in inputs) if (inputs[n]) b.inputs[n] = { block: Array.isArray(inputs[n]) ? chain(inputs[n]) : inputs[n] }; }
    return b;
  }
  function chain(list) { for (var i = list.length - 2; i >= 0; i--) list[i].next = { block: list[i + 1] }; return list[0]; }
  function V(nm) { return { VAR: { name: nm } }; }
  function lit(x) { return typeof x === 'number' ? D.n(x) : typeof x === 'string' ? D.t(x) : x; }

  var D = {
    t: function (s) { return mk('py_text', { T: s }); },
    n: function (n) { return mk('py_num', { N: String(n) }); },
    bool: function (b) { return mk('py_bool', { B: b ? 'True' : 'False' }); },
    v: function (nm) { return mk('py_get', V(nm)); },
    p: function (nm) { return mk('py_name', { NAME: nm }); },
    set: function (nm, x) { return mk('py_set', V(nm), { V: lit(x) }); },
    konst: function (nm, x) { return mk('py_const', V(nm), { V: lit(x) }); },
    glob: function (nm) { return mk('py_global', V(nm)); },
    pr: function (x) { return mk('py_print', null, { V: lit(x) }); },
    pr2: function (a, b) { return mk('py_print2', null, { A: lit(a), B: lit(b) }); },
    inp: function (prompt) { return mk('py_input', null, { P: D.t(prompt) }); },
    cm: function (s) { return mk('py_comment', { TEXT: s }); },
    op: function (a, o, b) { return mk('py_arith', { OP: o }, { A: lit(a), B: lit(b) }); },
    cmp: function (a, o, b) { return mk('py_compare', { OP: o }, { A: lit(a), B: lit(b) }); },
    lg: function (a, o, b) { return mk('py_logic', { OP: o }, { A: a, B: b }); },
    not: function (a) { return mk('py_not', null, { A: a }); },
    round: function (x, n) { return mk('py_round', null, { X: x, N: lit(n) }); },
    cast: function (fn, x) { return mk('py_cast', { FN: fn }, { V: lit(x) }); },
    len: function (x) { return mk('py_len', null, { S: x }); },
    meth: function (x, m) { return mk('py_method', { M: m }, { S: x }); },
    slice: function (x, a, b) { return mk('py_slice', null, { S: x, A: lit(a), B: lit(b) }); },
    left: function (x, n) { return mk('py_left', null, { S: x, N: lit(n) }); },
    right: function (x, n) { return mk('py_right', null, { S: x, N: lit(n) }); },
    idx: function (x, i) { return mk('py_index', null, { S: x, I: lit(i) }); },
    idx2: function (x, r, c) { return mk('py_index2', null, { S: x, R: lit(r), C: lit(c) }); },
    ord: function (x) { return mk('py_ord', null, { V: lit(x) }); },
    chr: function (x) { return mk('py_chr', null, { V: lit(x) }); },
    split: function (x, sep) { return mk('py_split', null, { S: x, SEP: D.t(sep) }); },
    list: function (items) { return mk('py_list', { ITEMS: items }); },
    empty: function () { return mk('py_list_empty'); },
    fill: function (x, n) { return mk('py_list_fill', null, { V: lit(x), N: lit(n) }); },
    grid: function (r, c, x) { return mk('py_grid', null, { R: lit(r), C: lit(c), V: lit(x) }); },
    seti: function (nm, i, x) { return mk('py_setitem', V(nm), { I: lit(i), V: lit(x) }); },
    seti2: function (nm, r, c, x) { return mk('py_setitem2', V(nm), { R: lit(r), C: lit(c), V: lit(x) }); },
    app: function (nm, x) { return mk('py_append', V(nm), { V: lit(x) }); },
    iff: function (c, d) { return mk('py_if', null, { C: c, DO: d }); },
    ife: function (c, d, e) { return mk('py_ifelse', null, { C: c, DO: d, EL: e }); },
    ifee: function (c1, d1, c2, d2, e) { return mk('py_ifelifelse', null, { C1: c1, DO1: d1, C2: c2, DO2: d2, EL: e }); },
    elif: function (c, d) { return mk('py_elif', null, { C: c, DO: d }); },
    els: function (d) { return mk('py_else', null, { DO: d }); },
    for1: function (nm, b, d) { return mk('py_for1', V(nm), { B: lit(b), DO: d }); },
    for2: function (nm, a, b, d) { return mk('py_for2', V(nm), { A: lit(a), B: lit(b), DO: d }); },
    for3: function (nm, a, b, st, d) { return mk('py_for3', V(nm), { A: lit(a), B: lit(b), S: lit(st), DO: d }); },
    each: function (nm, x, d) { return mk('py_foreach', V(nm), { S: x, DO: d }); },
    wh: function (c, d) { return mk('py_while', null, { C: c, DO: d }); },
    proc: function (nm, params, d) { return mk('py_def_proc', { NAME: nm, PARAMS: params }, { BODY: d }); },
    func: function (nm, params, d, r) { return mk('py_def_func', { NAME: nm, PARAMS: params }, { BODY: d && d.length ? d : null, RET: lit(r) }); },
    ret: function (x) { return mk('py_return', null, { V: lit(x) }); },
    call: function (nm, a, b) { var k = arguments.length - 1; return mk('py_call' + k, { NAME: nm }, k === 0 ? null : k === 1 ? { A: lit(a) } : { A: lit(a), B: lit(b) }); },
    fcall: function (nm, a, b) { var k = arguments.length - 1; return mk('py_fcall' + k, { NAME: nm }, k === 0 ? null : k === 1 ? { A: lit(a) } : { A: lit(a), B: lit(b) }); },
    fopen: function (nm, fn, mode) { var f = V(nm); f.FN = fn; f.MODE = mode; return mk('py_open', f); },
    fwrite: function (nm, x) { return mk('py_write', V(nm), { V: lit(x) }); },
    fclose: function (nm) { return mk('py_close', V(nm)); },
    freadline: function (nm) { return mk('py_readline', V(nm)); },
    fread: function (nm) { return mk('py_read', V(nm)); },
    imp: function (lib) { return mk('py_import', { LIB: lib }); },
    randint: function (a, b) { return mk('py_randint', null, { A: lit(a), B: lit(b) }); },
    sleep: function (x) { return mk('py_sleep', null, { S: lit(x) }); }
  };

  /** Turn a list of statements into a saved workspace. */
  function program(statements) {
    var top = chain([mk('py_start')].concat(statements)); top.x = 24; top.y = 24;
    return { blocks: { languageVersion: 0, blocks: [top] } };
  }

  return { PHRASE: PHRASE, COL: COL, BLANK: BLANK, BLOCK_STYLES: BLOCK_STYLES, TOOLBOX: TOOLBOX, D: D, program: program,
    defineAll: defineAll, codeOf: codeOf, codeFor: codeFor, variablesFlyout: variablesFlyout };
}

/* =====================================================================
   3. VIRTUAL FILES — open(), readline(), write()... for the browser.
   Written in Python and handed to the interpreter as the built-in open().
   ===================================================================== */
function PB_VFS(files) {
  return '_files = ' + JSON.stringify(files) + '\n' + [
    'class TextFile:',
    '    def __init__(self, name, mode):',
    '        self.name = name',
    '        self.mode = mode',
    '        self.closed = False',
    '        self._pos = 0',
    '        if mode == "r":',
    '            if name not in _files:',
    '                raise IOError("there is no file called \'" + name + "\'. Check the spelling, or write to it first")',
    '        elif mode == "w":',
    '            _files[name] = ""',
    '        elif mode == "a":',
    '            if name not in _files:',
    '                _files[name] = ""',
    '        else:',
    '            raise ValueError("the mode must be \\"r\\", \\"w\\" or \\"a\\"")',
    '    def _check(self, need):',
    '        if self.closed:',
    '            raise ValueError("this file has already been closed")',
    '        if need == "r" and self.mode != "r":',
    '            raise IOError("this file was opened for writing, so it cannot be read. Close it and open it again with \\"r\\"")',
    '        if need == "w" and self.mode == "r":',
    '            raise IOError("this file was opened with \\"r\\", so it cannot be written to. Open it with \\"w\\" or \\"a\\"")',
    '    def read(self):',
    '        self._check("r")',
    '        data = _files[self.name][self._pos:]',
    '        self._pos = len(_files[self.name])',
    '        return data',
    '    def readline(self):',
    '        self._check("r")',
    '        data = _files[self.name]',
    '        if self._pos >= len(data):',
    '            return ""',
    '        end = data.find("\\n", self._pos)',
    '        if end == -1:',
    '            end = len(data)',
    '        else:',
    '            end = end + 1',
    '        line = data[self._pos:end]',
    '        self._pos = end',
    '        return line',
    '    def readlines(self):',
    '        lines = []',
    '        line = self.readline()',
    '        while line != "":',
    '            lines.append(line)',
    '            line = self.readline()',
    '        return lines',
    '    def write(self, text):',
    '        self._check("w")',
    '        if not isinstance(text, str):',
    '            raise TypeError("write() needs a string. Use str() to convert a number first")',

      return Sk.misceval.asyncToPromise(function () { return Sk.importMainWithBody('<stdin>', false, code, true); })
        .then(function () { con.info('\nProgram finished.'); }, function (err) {
          if (stopReason === 'flood') con.error('Stopped:', 'your program printed a huge amount of output.', 'Does the loop ever end? Something inside it must change the condition.');
          else if (stopReason) con.info('\nStopped.');
          else { var d = describe(err); con.error(d.title, d.message, d.hint); renderCode(d.line); }
        })
        .then(function () { try { files = Sk.ffi.remapToJs(fsModule.$d._files); } catch (e) { /* keep the old files */ } if (!$('files').hidden) renderFiles(); });
    }, function () {
      con.clear(); con.error('Python could not load.', 'The Python engine is downloaded the first time you press Run, and the download failed.', 'Check the internet connection, then reload the page. Your code is still in the Python panel to copy.');
    }).then(function () { clearTimeout(slowTimer); setRunning(false); }, function (e) { clearTimeout(slowTimer); setRunning(false); con.error('Something went wrong:', String(e)); });
  }
  function stop() { if (!running) return; stopReason = stopReason || 'user'; if (window.Sk) Sk.execLimit = 1; con.cancelAsk(); }
  $('btnRun').onclick = run; $('btnStop').onclick = stop;
  document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); } });

  /* ---------------- clear, copy, resize ---------------- */
  $('btnClear').onclick = function () { var b = $('btnClear'); twoClicks(b, b, 'Delete all blocks?', function () { loadState(core.program([])); }); };
  $('btnCopy').onclick = function () {
    var b = $('btnCopy'); function done(ok) { b.textContent = ok ? 'Copied' : 'Select the code and copy it'; setTimeout(function () { b.textContent = 'Copy code'; }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(function () { done(true); }, function () { done(false); }); else done(false);
  };
  (function () {
    var handle = $('handle'), app = document.querySelector('.app'), dragging = false;
    handle.addEventListener('pointerdown', function (e) { dragging = true; handle.classList.add('on'); handle.setPointerCapture(e.pointerId); e.preventDefault(); });
    handle.addEventListener('pointermove', function (e) { if (!dragging) return; var w = Math.max(300, Math.min(window.innerWidth * 0.6, window.innerWidth - e.clientX)); app.style.setProperty('--side-w', w + 'px'); });
    handle.addEventListener('pointerup', function () { dragging = false; handle.classList.remove('on'); Blockly.svgResize(ws); });
  })();

  /* ---------------- start up ---------------- */
  resetFiles(); selectPane('console'); con.info('Press Run to start your program.'); renderCode();
  var saved = null; try { saved = JSON.parse(store(STORE) || 'null'); } catch (e) { saved = null; }
  if (saved && saved.blocks) { try { if (saved.files) files = saved.files; Blockly.serialization.workspaces.load(saved.blocks, ws); setTimeout(function () { dirty = true; }, 200); } catch (e) { ws.clear(); } }
  if (!ws.getAllBlocks(false).length) { loadState(core.program([])); }
  document.body.classList.add('ready');
  return { workspace: ws, run: run, stop: stop, loadState: loadState, content: content, core: core };
}

/* =====================================================================
   5. START UP — fetch the libraries (trying a second CDN if the first is
   blocked), then build the page. Python loads in the background.
   ===================================================================== */
(function () {
  var B = 'blockly@13.2.1', S = 'skulpt@1.2.0/dist/';
  var SOURCES = {
    blockly: ['https://cdnjs.cloudflare.com/ajax/libs/blockly/13.2.1/blockly.min.js', 'https://cdn.jsdelivr.net/npm/' + B + '/blockly.min.js', 'https://unpkg.com/' + B + '/blockly.min.js'],
    python: ['https://cdnjs.cloudflare.com/ajax/libs/blockly/13.2.1/python_compressed.js', 'https://cdn.jsdelivr.net/npm/' + B + '/python_compressed.js', 'https://unpkg.com/' + B + '/python_compressed.js'],
    skulpt: ['https://cdn.jsdelivr.net/npm/' + S + 'skulpt.min.js', 'https://unpkg.com/' + S + 'skulpt.min.js'],
    stdlib: ['https://cdn.jsdelivr.net/npm/' + S + 'skulpt-stdlib.js', 'https://unpkg.com/' + S + 'skulpt-stdlib.js']
  };
  function fetchScript(urls) {
    return new Promise(function (resolve, reject) {
      var i = 0;
      (function next() {
        if (i >= urls.length) return reject(new Error('Could not load ' + urls[0]));
        var s = document.createElement('script'); s.src = urls[i++];
        s.onload = resolve; s.onerror = function () { s.remove(); next(); };
        document.head.appendChild(s);
      })();
    });
  }
  var blocksReady = window.Blockly && window.python ? Promise.resolve() : fetchScript(SOURCES.blockly).then(function () { return fetchScript(SOURCES.python); });
  var pythonReady = window.Sk ? Promise.resolve() : fetchScript(SOURCES.skulpt).then(function () { return fetchScript(SOURCES.stdlib); });
  pythonReady.catch(function () {});
  blocksReady.then(function () { window.PythonBlocks = PB_ui(window.Blockly, window.python, pythonReady); }, function () {
    document.querySelector('.app').innerHTML = '<p class="fatal"><b>The block editor could not load.</b><br>This page downloads Blockly from the internet, and the download was blocked. Check the connection, or use the offline copy of this page.</p>';
  });
})();
</script>
