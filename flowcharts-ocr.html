<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowcharts for OCR GCSE Computer Science</title>
<!--
  Flowcharts (OCR J277 edition). One self-contained page: no build step, no server.
  Draw a flowchart and get Python, or type Python and get the flowchart. The Python is run for real
  in the browser by Skulpt, one shape at a time if you like, with a variable watch and a trace table.
  Script sections: 1 CORE (parser, generators, layout)  2 CONTENT (examples, symbols)  3 INTERFACE  4 START UP.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F7FB; --surface:#FFFFFF; --surface-2:#EAF0F8; --line:#CBD7E6; --grid:#DCE6F2;
  --ink:#14213D; --ink-2:#44546F; --ink-3:#6B7A93;
  --run:#FFD23F; --run-ink:#14213D; --stop:#C92A2A; --focus:#1971C2; --accent:#1971C2;
  --code-bg:#FFFFFF; --code-ink:#14213D; --code-no:#9AA8BD; --code-hit:#FFF1B8;
  --con-bg:#101A30; --con-ink:#DCE7F7; --con-dim:#8FA2C0; --con-err:#FF9B9B; --con-in:#FFD23F;
  --kw:#A61E4D; --fn:#1864AB; --st:#2B7A0B; --nb:#B45309; --cm:#6B7280;
  --ui:"Atkinson Hyperlegible","Verdana","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code","Consolas","Menlo",monospace;
  --side-w:clamp(320px,29vw,430px);
}
:root[data-theme="dark"]{
  --paper:#0F1729; --surface:#17213A; --surface-2:#1E2B49; --line:#2C3B5E; --grid:#1B2742;
  --ink:#E6ECF8; --ink-2:#B5C2DA; --ink-3:#8797B5;
  --run:#FFD23F; --run-ink:#14213D; --focus:#74C0FC; --accent:#74C0FC;
  --code-bg:#131D34; --code-ink:#E6ECF8; --code-no:#5C6E90; --code-hit:#4A3F12;
  --con-bg:#0A1122;
  --kw:#FF8FB1; --fn:#8CC8FF; --st:#A5E08A; --nb:#FFC078; --cm:#8797B5;
}
*{box-sizing:border-box;margin:0;padding:0}
/* Code must look exactly as it is typed: stop the code font joining >= into \2265, != into \2260, == into one long bar */
*,svg text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0,"clig" 0}
html,body{height:100%}
body{font-family:var(--ui);font-size:15px;line-height:1.45;color:var(--ink);background:var(--paper);display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--ink);color:#fff;flex-wrap:wrap}
:root[data-theme="dark"] .bar{background:#0A1122;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:6px}
.brand strong{font-size:19px;letter-spacing:-.01em}
.brand span{font-size:13px;color:#B9C6DC}
.bar .spacer{flex:1}
.nb{border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;padding:6px 13px;border-radius:8px;font-weight:700;font-size:14px}
.nb:hover{background:rgba(255,255,255,.12)}
.nb[aria-expanded="true"]{background:#fff;color:#14213D;border-color:#fff}
.nb.quiet{border-color:transparent;font-weight:400;color:#D5DEEE}
.nb.run{background:var(--run);color:var(--run-ink);border-color:var(--run);padding:6px 20px}
.nb.run:hover{filter:brightness(1.06)}
.nb.stop{background:var(--stop);border-color:var(--stop)}
.nb.armed{background:#FFE3E3;color:#8A1C1C;border-color:#FFE3E3}
.nb[hidden]{display:none}

/* ---------- main layout ---------- */
.app{display:grid;grid-template-columns:auto minmax(0,1fr) 7px var(--side-w);min-height:0}
.drawer{width:clamp(320px,27vw,400px);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.drawer[hidden]{display:none}
.drawer{grid-column:1}.stage{grid-column:2}.handle{grid-column:3}.side{grid-column:4}
.stage{position:relative;min-width:0;min-height:0}
#blocklyDiv{position:absolute;inset:0}
.empty{position:absolute;left:50%;top:42%;transform:translate(-30%,-50%);max-width:340px;color:var(--ink-3);font-size:16px;pointer-events:none;text-align:left}
.empty b{display:block;color:var(--ink-2);font-size:20px;margin-bottom:6px}
.empty[hidden]{display:none}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;color:var(--ink-2)}
.zoom button:hover{background:var(--surface-2)}
.handle{background:var(--line);cursor:col-resize}
.handle:hover,.handle.on{background:var(--accent)}
.side{display:grid;grid-template-rows:minmax(0,1.15fr) minmax(0,1fr);min-width:0;min-height:0;background:var(--surface)}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.pane + .pane{border-top:1px solid var(--line)}
.pane-head{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.pane-head .grow{flex:1}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 10px;font-size:13px;font-weight:400}
.mini:hover{background:var(--paper)}
.tab{border:0;background:transparent;padding:4px 10px;border-radius:7px;font-weight:700;color:var(--ink-3)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

/* ---------- code view ---------- */
.code{flex:1;overflow:auto;background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:14px;line-height:1.6;padding:10px 0}
.ln{display:flex;white-space:pre;padding-right:14px}
.ln .no{flex:none;width:42px;text-align:right;padding-right:12px;color:var(--code-no);user-select:none}
.ln.hit{background:var(--code-hit)}
.code .hint{padding:4px 16px;color:var(--ink-3);font-family:var(--ui);font-size:15px;white-space:normal}
.kw{color:var(--kw);font-weight:700}.fn{color:var(--fn)}.st{color:var(--st)}.nu{color:var(--nb)}.cm{color:var(--cm);font-style:italic}

/* ---------- console + files ---------- */
.console{flex:1;overflow:auto;background:var(--con-bg);color:var(--con-ink);font-family:var(--mono);font-size:14px;line-height:1.55;padding:10px 14px;white-space:pre-wrap;word-break:break-word}
.console .dim{color:var(--con-dim);font-family:var(--ui)}
.console .err{color:var(--con-err);font-family:var(--ui);white-space:normal;margin-top:6px;display:block}
.console .err b{color:#fff}
.console .typed{color:var(--con-in)}
.console input{font:inherit;color:var(--con-in);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:1px 6px;min-width:12ch;width:60%}
.files{flex:1;overflow:auto;padding:10px 12px;background:var(--surface)}
.files p{color:var(--ink-3);font-size:14px;margin-bottom:10px}
.file{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden}
.file header{display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--surface-2);font-family:var(--mono);font-size:13px;font-weight:700}
.file header span{flex:1}
.file pre{font-family:var(--mono);font-size:13px;padding:8px 10px;white-space:pre-wrap;max-height:160px;overflow:auto}
.file pre:empty::before{content:"(empty file)";color:var(--ink-3);font-family:var(--ui)}
[hidden]{display:none !important}

/* ---------- drawer: help + examples ---------- */
.drawer-head{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.drawer-head .grow{flex:1}
.drawer-body{flex:1;overflow:auto;position:relative;padding:12px 12px 40px}
.lede{color:var(--ink-2);margin:2px 4px 12px;max-width:44ch}
.group{font-size:13px;font-weight:700;color:var(--ink-3);margin:16px 4px 6px}
.topic{display:flex;width:100%;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-weight:700}
.topic:hover{background:var(--paper)}
.topic i{flex:none;width:10px;height:22px;border-radius:3px;background:var(--c,#888)}
.topic span{flex:1}
.topic small{font-weight:400;color:var(--ink-3);display:block;font-size:13.5px}
.topic::after{content:"+";color:var(--ink-3);font-weight:400;font-size:18px;line-height:1}
.topic.example::after{content:"";display:none}
.topic[aria-expanded="true"]{border-radius:10px 10px 0 0;background:var(--surface-2);margin-bottom:0}
.topic[aria-expanded="true"]::after{content:"\2212"}
.detail{border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:12px 12px 14px;margin-bottom:8px;background:var(--surface)}
.detail p{margin-bottom:9px;max-width:48ch}
.detail h4{font-size:13px;color:var(--ink-3);margin:12px 0 4px;font-weight:700}
.detail pre{font-family:var(--mono);font-size:13px;line-height:1.55;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:pre}
.detail table{border-collapse:collapse;width:100%;font-size:13.5px;margin:4px 0 8px}
.detail th{text-align:left;color:var(--ink-3);font-size:12.5px;padding:3px 6px;border-bottom:1px solid var(--line)}
.detail td{padding:4px 6px;border-bottom:1px solid var(--grid);vertical-align:top}
.detail td code{font-family:var(--mono);font-size:13px;white-space:nowrap}
.note{background:#FFF6D6;border-left:4px solid var(--run);padding:7px 10px;border-radius:0 8px 8px 0;margin:10px 0 0;font-size:14px;color:#3D3205}
:root[data-theme="dark"] .note{background:#3A3210;color:#F6E7A8}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.act{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:6px 12px;font-weight:700;font-size:14px}
:root[data-theme="dark"] .act{background:var(--run);color:var(--run-ink);border-color:var(--run)}
.act.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:400}
.act.armed{background:#FFE3E3;color:#8A1C1C;border-color:#F3B4B4}

/* ---------- toast + modal ---------- */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-weight:700;z-index:200;max-width:90vw;box-shadow:0 6px 24px rgba(10,20,45,.3)}
:root[data-theme="dark"] .toast{background:#fff;color:#14213D}
.veil{position:fixed;inset:0;background:rgba(10,18,36,.55);display:grid;place-items:center;z-index:80;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;width:min(380px,100%);box-shadow:0 18px 60px rgba(0,0,0,.4)}
.modal p{margin-bottom:10px;font-weight:700}
.modal input{width:100%;font:inherit;font-family:var(--mono);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.modal .actions{justify-content:flex-end}
.fatal{margin:40px auto;max-width:520px;padding:0 20px}

/* ---------- flowchart canvas ---------- */
.canvas{position:absolute;inset:0;overflow:auto;padding:0 0 60px;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.canvas svg{display:block;min-width:100%}
.canvas.stale svg{opacity:.45}
.fc-node{cursor:pointer;outline:none}
.fc-node:hover>rect,.fc-node:hover>polygon,.fc-node:focus-visible>rect,.fc-node:focus-visible>polygon{stroke-width:3.5}
.fc-node.active>rect,.fc-node.active>polygon{stroke:#F59F00;stroke-width:5;filter:drop-shadow(0 0 6px rgba(255,210,63,.95))}
.fc-node.error>rect,.fc-node.error>polygon{stroke:#E03131;stroke-width:5}
.fc-plus{cursor:pointer;opacity:.5;outline:none}
.fc-plus circle{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.5}
.fc-plus path{stroke:var(--ink-2);stroke-width:2;fill:none}
.fc-plus:hover,.fc-plus:focus-visible{opacity:1}
.fc-plus:hover circle,.fc-plus:focus-visible circle{fill:var(--run);stroke:#14213D}
.fc-plus:hover path{stroke:#14213D}
.stage-tools{position:absolute;left:14px;bottom:14px;z-index:5;display:flex;gap:6px}
.stage-tools button{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:10px;padding:7px 12px;font-size:14px}
.stage-tools button:hover{background:var(--surface-2)}
.menu{position:fixed;z-index:90;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 40px rgba(10,20,45,.28);display:grid;gap:2px;width:230px}
.menu b{font-size:13px;color:var(--ink-3);padding:4px 8px 2px}
.menu button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:7px 8px;border-radius:8px;font-weight:700}
.menu button:hover,.menu button:focus-visible{background:var(--surface-2)}
.menu button small{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px}
.menu svg{flex:none}
/* ---------- editor ---------- */
.editor{flex:1;display:flex;flex-direction:column;min-height:0}
.editor textarea{flex:1;resize:none;border:0;outline:none;background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:14px;line-height:1.6;padding:10px 14px;tab-size:4;white-space:pre;overflow:auto}
.editor textarea:focus-visible{outline:3px solid var(--focus);outline-offset:-3px;border-radius:0}
.status{padding:5px 12px;font-size:13.5px;border-top:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.status.bad{background:#FFE3E3;color:#8A1C1C}
:root[data-theme="dark"] .status.bad{background:#4A1D1D;color:#FFC9C9}
.erl{flex:1;overflow:auto;background:var(--code-bg);font-family:var(--mono);font-size:14px;line-height:1.6;padding:10px 14px;white-space:pre}
.tablebox{flex:1;overflow:auto;background:var(--surface);padding:10px 12px}
.tablebox p{color:var(--ink-3);font-size:14px;margin-bottom:8px}
.tablebox table{border-collapse:collapse;font-family:var(--mono);font-size:13px}
.tablebox th{position:sticky;top:-10px;background:var(--surface-2);text-align:left;padding:4px 10px;border:1px solid var(--line)}
.tablebox td{padding:3px 10px;border:1px solid var(--line);white-space:pre}
.tablebox td.shape{font-family:var(--ui);color:var(--ink-3)}
select.nb{appearance:auto;background:transparent}
select.nb option{color:#14213D}
.symbol{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--surface)}
.symbol svg{flex:none}
.symbol b{display:block}
.symbol p{font-size:14px;color:var(--ink-2)}
.modal label{display:block;font-size:13.5px;font-weight:700;margin:10px 0 3px}
.modal small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:3px}
.modal select{width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.modal .actions .danger{margin-right:auto;border-color:#F3B4B4;color:#8A1C1C;background:#FFE3E3}
.modal{width:min(440px,100%)}

@media (max-width:980px){
  body{overflow:auto;height:auto;min-height:100dvh}
  .app{grid-template-columns:minmax(0,1fr);grid-auto-rows:auto}
  .drawer,.stage,.handle,.side{grid-column:1}
  .drawer{width:100%;max-height:60vh;border-right:0;border-bottom:1px solid var(--line)}
  .stage{height:62vh}
  .handle{display:none}
  .side{grid-template-rows:auto auto}
  .pane{height:300px}
}
@media (prefers-reduced-motion:no-preference){
  .detail{animation:open .16s ease-out}
  @keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><strong>Flowcharts</strong><span>OCR GCSE Computer Science J277</span></div>
  <button class="nb" id="btnSymbols" type="button" aria-expanded="false" aria-controls="drawer">Symbols</button>
  <button class="nb" id="btnExamples" type="button" aria-expanded="false" aria-controls="drawer">Examples</button>
  <span class="spacer"></span>
  <button class="nb quiet" id="btnTheme" type="button">Dark mode</button>
  <button class="nb" id="btnUndo" type="button">Undo</button>
  <button class="nb" id="btnNew" type="button">New</button>
  <button class="nb" id="btnSvg" type="button" title="Download the flowchart as a picture">Save picture</button>
  <select class="nb" id="speed" aria-label="Run speed"><option value="500">Slow</option><option value="120" selected>Fast</option><option value="0">Instant</option></select>
  <button class="nb" id="btnStep" type="button" title="Run one shape at a time">Step</button>
  <button class="nb stop" id="btnStop" type="button" hidden>Stop</button>
  <button class="nb run" id="btnRun" type="button" title="Run (Ctrl + Enter)">Run</button>
</header>

<main class="app">
  <aside class="drawer" id="drawer" aria-label="Symbols and examples" hidden>
    <div class="drawer-head" role="tablist">
      <button class="tab" id="tabSymbols" type="button" role="tab" aria-selected="false">Symbols</button>
      <button class="tab" id="tabExamples" type="button" role="tab" aria-selected="false">Examples</button>
      <span class="grow"></span>
      <button class="mini" id="btnCloseDrawer" type="button">Close</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <section class="stage" aria-label="Flowchart">
    <div class="canvas" id="canvas"></div>
    <div class="stage-tools"><button id="btnAddSub" type="button">Add a sub program</button><button id="btnLabels" type="button" title="Switch what is written inside the shapes">Labels: exam style</button></div>
    <div class="zoom">
      <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
      <button id="zoomOut" type="button" aria-label="Zoom out">&minus;</button>
    </div>
  </section>

  <div class="handle" id="handle" aria-hidden="true"></div>

  <section class="side">
    <div class="pane">
      <div class="pane-head" role="tablist">
        <button class="tab" id="tabPython" type="button" role="tab">Python</button>
        <button class="tab" id="tabErl" type="button" role="tab">OCR reference language</button>
      </div>
      <div class="editor" id="panePython"><textarea id="python" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Python code: edit it and the flowchart redraws"></textarea></div>
      <div class="erl" id="paneErl" hidden><div id="erl"></div></div>
      <div class="status" id="status" role="status"></div>
    </div>
    <div class="pane">
      <div class="pane-head" role="tablist">
        <button class="tab" id="tabConsole" type="button" role="tab">Console</button>
        <button class="tab" id="tabVars" type="button" role="tab">Variables</button>
        <button class="tab" id="tabTrace" type="button" role="tab">Trace table</button>
        <span class="grow"></span>
        <button class="mini" id="btnClearConsole" type="button">Clear</button>
      </div>
      <div class="console" id="paneConsole" role="log"><span id="console"></span></div>
      <div class="tablebox" id="paneVars" hidden></div>
      <div class="tablebox" id="paneTrace" hidden></div>
    </div>
  </section>
</main>

<script>
/* =====================================================================
   1. CORE — the program model, Python <-> model, OCR reference language,
   and the automatic flowchart layout. Works in the browser and in Node.

   A program is { imports: [names], subs: [sub], main: [stmt] }
   sub  = { id, name, params, ret, body: [stmt] }        ret '' = procedure
   stmt = { id, type, ... } where type is one of
     process {text}            input {name, prompt, cast}     output {expr}
     call {text}               if {cond, yes:[], no:[]}       while {cond, body:[]}
     for {name, start, stop, step, body:[]}
   ===================================================================== */
function FC_core() {
  var uid = 1;
  function nid() { return uid++; }

  /* ---------------- small text helpers ---------------- */
  // Split code into tokens, keeping strings whole, so operators inside quotes are never touched.
  function tokens(src) {
    var out = [], re = /("(?:\\.|[^"\\])*"?|'(?:\\.|[^'\\])*'?)|([A-Za-z_]\w*)|(\*\*|\/\/|==|!=|<=|>=|\s+|.)/g, m;
    while ((m = re.exec(src))) out.push(m[1] ? { s: m[1], str: true } : m[2] ? { s: m[2], word: true } : { s: m[3] });
    return out;
  }
  /** Python expression -> OCR Exam Reference Language operators. */
  function erl(expr) {
    var map = { and: 'AND', or: 'OR', not: 'NOT', '**': '^', '//': 'DIV', '%': 'MOD' };
    return tokens(expr).map(function (t) { return !t.str && map.hasOwnProperty(t.s) ? map[t.s] : t.s; }).join('').replace(/\brandom\.(randint|uniform)\(/g, 'random(');
  }
  function stripComment(line) {
    var out = '', t = tokens(line), i;
    for (i = 0; i < t.length; i++) { if (!t[i].str && t[i].s === '#') break; out += t[i].s; }
    return out.replace(/\s+$/, '');
  }
  function splitArgs(src) {   // top-level commas only
    var parts = [], depth = 0, cur = '';
    tokens(src).forEach(function (t) {
      if (!t.str && /^[\(\[\{]$/.test(t.s)) depth++;

  /* ---------------- finding things in the model ---------------- */
  function find(prog, id) {

      call: { type: 'call', text: 'showMenu()' }, 'if': { type: 'if', cond: 'number > 10', yes: [], no: [] }, 'while': { type: 'while', cond: 'number != 0', body: [] },

  return { parse: parse, ParseError: ParseError, toPython: toPython, toERL: toERL, erl: erl, label: label, draw: draw, find: find, renumber: renumber, blank: blank, nid: nid };
}

/* =====================================================================
   2. CONTENT — examples (plain Python: the tool draws the flowchart from it)
   and the symbol guide. To add an example, add { title, about, code }.
   ===================================================================== */
function FC_content() {
  var EXAMPLES = [
    { group: 'Sequence', items: [
      { title: 'Area of a rectangle', about: 'Input, process, output: no decisions at all.', code: 'width = int(input("Width: "))\nheight = int(input("Height: "))\narea = width * height\nprint("Area:", area)\n' } ] },

        flush();
        return new Promise(function (resolve, reject) {
          var input = el('input'); input.setAttribute('aria-label', 'Type your answer and press Enter'); input.setAttribute('spellcheck', 'false'); input.setAttribute('autocomplete', 'off');
          function finish(ok) { var v = input.value; pending = null; input.replaceWith(el('span', 'typed', ok ? v + '\n' : '\n')); if (ok) resolve(v); else reject(new Error('stopped')); }
          input.addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); finish(true); } });
          pending = finish; box.appendChild(input); sc.scrollTop = sc.scrollHeight; showBottom('Console'); setTimeout(function () { input.focus(); }, 30);
        });
      },
      waiting: function () { return !!pending; }, cancel: function () { if (pending) pending(false); }
    };
  })();

  /* ---------------- variables and trace table ---------------- */
  var trace = { vars: [], rows: [], prev: {}, prevNode: null, out: '', dirty: false };
  function snapshot() {
    var g = Sk.globals || {}, snap = {}, k, v;
    for (k in g) { if (k.indexOf('__') === 0) continue; v = g[k]; if (!v || v instanceof Sk.builtin.func || v instanceof Sk.builtin.module || v.tp$name === 'function' || v.tp$name === 'type') continue; try { snap[k] = Sk.builtin.repr(v).v; } catch (e) { /* skip */ } }
    return snap;
  }
  function shapeLabel(id) { if (id == null) return ''; var hit = core.find(prog, id); if (hit) return hit.node.type === 'for' ? 'for ' + hit.node.name : core.label(hit.node, exam); var f = prog.subs.filter(function (s) { return s.id === id; })[0]; return f ? f.name + '()' : ''; }
  function record(nextId) {
    var snap = snapshot(), changed = {}, any = false, k;
    for (k in snap) if (snap[k] !== trace.prev[k]) { changed[k] = snap[k]; any = true; if (trace.vars.indexOf(k) < 0) trace.vars.push(k); }
    if ((any || trace.out) && trace.rows.length < 400) trace.rows.push({ shape: shapeLabel(trace.prevNode), values: changed, out: trace.out.replace(/\n$/, '') });
    trace.prev = snap; trace.prevNode = nextId; trace.out = '';
    if (!trace.dirty) { trace.dirty = true; requestAnimationFrame(renderTrace); }
  }
  function renderTrace() {
    trace.dirty = false;
    var names = Object.keys(trace.prev).sort(), h = '<p>Variables in the main program, as they are right now.</p>';
    h += names.length ? '<table><tr><th>Variable</th><th>Value</th></tr>' + names.map(function (n) { return '<tr><td>' + esc(n) + '</td><td>' + esc(trace.prev[n]) + '</td></tr>'; }).join('') + '</table>' : '<p>No variables yet. Press Run or Step.</p>';
    $('paneVars').innerHTML = h;
    h = '<p>A new row is added each time a value changes or something is output, just like a trace table in the exam.</p>';
    if (trace.rows.length) {
      h += '<table><tr><th>Shape</th>' + trace.vars.map(function (v) { return '<th>' + esc(v) + '</th>'; }).join('') + '<th>OUTPUT</th></tr>' +
        trace.rows.map(function (r) { return '<tr><td class="shape">' + esc(r.shape) + '</td>' + trace.vars.map(function (v) { return '<td>' + (r.values[v] !== undefined ? esc(r.values[v]) : '') + '</td>'; }).join('') + '<td>' + esc(r.out) + '</td></tr>'; }).join('') + '</table>';
      if (trace.rows.length >= 400) h += '<p>The table stops at 400 rows.</p>';
    } else h += '<p>Nothing to show yet. Press Run or Step.</p>';
    $('paneTrace').innerHTML = h; $('paneTrace').scrollTop = $('paneTrace').scrollHeight;
  }

  /* ---------------- running ---------------- */
  var stopReason = null, mode = 'run', resumeStep = null, lastNode = null, LIMIT = 60000;
  var HINTS = [[/^NameError/, /'(random|time|math)'/, 'Add  import random  (or time, or math) as the first line of the Python.'], [/^NameError/, null, 'That name has not been given a value yet. Check the spelling and capital letters, and make sure an earlier shape sets it.'],
    [/^UnboundLocalError/, null, 'A sub program is changing a variable from the main program. Pass the value in as a parameter and return the result.'],
    [/^TypeError/, /operand|concatenate|must be str|can only/i, 'Text and numbers are being mixed. In the Input shape choose integer or real, or wrap a number in str() before joining it to text.'],
    [/^TypeError/, /argument|positional|takes/i, 'The call and the sub program must have the same number of values in their brackets.'],
    [/^ValueError/, /invalid literal|could not convert/i, 'The user typed something that is not a number, and int() or float() could not convert it.'], [/^ZeroDivisionError/, null, 'Dividing by zero is impossible. Add a decision to check the value first.'],
    [/^IndexError/, null, 'That position does not exist. Indexes start at 0, so the last item is at len - 1.'], [/^(SyntaxError|IndentationError|ParseError)/, null, 'Python cannot read what is written in this shape. Check brackets, quotes and operators.']];
  function mark(id, cls) {
    Array.prototype.forEach.call(document.querySelectorAll('.fc-node.active,.fc-node.error'), function (n) { n.classList.remove('active', 'error'); });
    if (id == null) return;
    var n = document.querySelector('.fc-node[data-id="' + id + '"]') || document.querySelector('.fc-node[data-id="sub' + id + '"]');
    if (n) { n.classList.add(cls); var r = n.getBoundingClientRect(), c = $('canvas').getBoundingClientRect(); if (r.top < c.top + 10 || r.bottom > c.bottom - 10 || r.left < c.left || r.right > c.right) n.scrollIntoView({ block: 'center', inline: 'center' }); }
  }
  function setRunning(on) { running = on; $('btnRun').textContent = on && mode === 'step' ? 'Continue' : 'Run'; $('btnRun').hidden = on && mode !== 'step'; $('btnStop').hidden = !on; editor.readOnly = on; }

  function start(startMode) {
    if (running) { if (startMode === 'run' && mode === 'step') { mode = 'run'; setRunning(true); } if (resumeStep) { var go = resumeStep; resumeStep = null; go(); } return; }
    clearTimeout(typing); fromCode(true);
    if (!parseOk) { status($('status').textContent, true); con.clear(); con.error('Not ready to run:', 'the Python has a mistake, so there is no flowchart to follow.', $('status').textContent); return; }
    if (!prog.main.length) { con.clear(); con.info('There is nothing to run yet. Click the + on the arrow between Start and Stop.'); return; }
    mode = startMode; stopReason = null; lastNode = null; trace = { vars: [], rows: [], prev: {}, prevNode: null, out: '', dirty: false };
    con.clear(); con.info('Loading Python...'); setRunning(true); renderTrace();
    pythonReady.then(function () {
      con.clear();
      Sk.configure({
        output: function (t) { if (stopReason) return; con.write(t); trace.out += t; if (con.size() > LIMIT) { stopReason = 'flood'; Sk.execLimit = 1; } },
        read: function (p) { if (Sk.builtinFiles === undefined || Sk.builtinFiles.files[p] === undefined) throw "File not found: '" + p + "'"; return Sk.builtinFiles.files[p]; },
        inputfun: function (prompt) { con.write(prompt); return con.ask(); }, inputfunTakesPrompt: true, __future__: Sk.python3, yieldLimit: 100, killableWhile: true, killableFor: true
      });
      Sk.execLimit = Number.POSITIVE_INFINITY;
      Sk.builtins.__at = new Sk.builtin.func(function (pyId) {
        var id = Sk.ffi.remapToJs(pyId), delay = +$('speed').value;
        record(id); lastNode = id;
        if (mode === 'run' && delay === 0) return Sk.builtin.bool.true$;
        mark(id, 'active');
        return Sk.misceval.promiseToSuspension(new Promise(function (resolve, reject) {
          function go() { if (stopReason) reject(new Error('stopped')); else resolve(Sk.builtin.bool.true$); }
          if (mode === 'step') { resumeStep = go; setRunning(true); } else setTimeout(go, delay);
        }));
      });
      return Sk.misceval.asyncToPromise(function () { return Sk.importMainWithBody('<stdin>', false, core.toPython(prog, true), true); }).then(function () {
        record(null); mark(null); con.info('\nProgram finished.');
      }, function (err) {
        record(null);
        if (stopReason === 'flood') { mark(null); con.error('Stopped:', 'the program printed a huge amount of output.', 'Does the loop ever end? Something inside it must change the answer to its decision.'); }
        else if (stopReason) { mark(null); con.info('\nStopped.'); }
        else {
          var name = err && err.tp$name || 'Error', msg = String(err), hint = null, i;
          try { if (err.args && err.args.v.length) msg = String(Sk.ffi.remapToJs(err.args.v[0])); } catch (e) { /* keep */ }
          for (i = 0; i < HINTS.length && !hint; i++) if (HINTS[i][0].test(name) && (!HINTS[i][1] || HINTS[i][1].test(msg))) hint = HINTS[i][2];
          mark(lastNode, 'error'); con.error(name + ' in the red shape:', msg, hint);
        }
      });
    }, function () { con.clear(); con.error('Python could not load.', 'The Python engine is downloaded the first time you press Run, and the download failed.', 'Check the internet connection and reload, or use the offline copy of this page.'); })
      .then(function () { resumeStep = null; setRunning(false); }, function (e) { resumeStep = null; setRunning(false); con.error('Something went wrong:', String(e)); });
  }
  function stop() { if (!running) return; stopReason = stopReason || 'user'; if (window.Sk) Sk.execLimit = 1; con.cancel(); if (resumeStep) { var go = resumeStep; resumeStep = null; go(); } }
  $('btnRun').onclick = function () { start('run'); }; $('btnStep').onclick = function () { start('step'); }; $('btnStop').onclick = stop;
  document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); start('run'); } });
  $('btnClearConsole').onclick = function () { if (!running) { con.clear(); con.info('Press Run, or Step to go one shape at a time.'); } };

  (function () {
    var handle = $('handle'), app = document.querySelector('.app'), drag = false;
    handle.addEventListener('pointerdown', function (e) { drag = true; handle.classList.add('on'); handle.setPointerCapture(e.pointerId); e.preventDefault(); });
    handle.addEventListener('pointermove', function (e) { if (drag) app.style.setProperty('--side-w', Math.max(300, Math.min(window.innerWidth * 0.6, window.innerWidth - e.clientX)) + 'px'); });
    handle.addEventListener('pointerup', function () { drag = false; handle.classList.remove('on'); });
  })();

  /* ---------------- start up ---------------- */
  setLabels(); setThemeLabel(); renderSymbols(); renderExamples(); showTop('Python'); showBottom('Console'); renderTrace();
  con.info('Press Run, or Step to go one shape at a time.');
  var saved = store(STORE); editor.value = saved != null && saved.trim() ? saved : content.START; fromCode(true);
  if (parseOk) status('Click a shape to change it, click a + to add one, or edit the Python.');
  document.body.classList.add('ready');
  return { core: core, content: content, setCode: setCode, getProg: function () { return prog; } };
}

/* =====================================================================
   4. START UP — Python (Skulpt) loads in the background, trying a second CDN if the first is blocked.
   ===================================================================== */
(function () {
  var S = 'skulpt@1.2.0/dist/';
  function fetchScript(urls) {
    return new Promise(function (resolve, reject) {
      var i = 0;
      (function next() {
        if (i >= urls.length) return reject(new Error('Could not load ' + urls[0]));
        var s = document.createElement('script'); s.src = urls[i++]; s.onload = resolve; s.onerror = function () { s.remove(); next(); }; document.head.appendChild(s);
      })();
    });
  }
  var pythonReady = window.Sk ? Promise.resolve() : fetchScript(['https://cdn.jsdelivr.net/npm/' + S + 'skulpt.min.js', 'https://unpkg.com/' + S + 'skulpt.min.js'])
    .then(function () { return fetchScript(['https://cdn.jsdelivr.net/npm/' + S + 'skulpt-stdlib.js', 'https://unpkg.com/' + S + 'skulpt-stdlib.js']); });
  pythonReady.catch(function () {});
  window.Flowcharts = FC_ui(pythonReady);
})();
</script>
